[alembic]
# script_location es relativo a este archivo (raíz del repo).
script_location = migrations

# La URL real se inyecta en runtime (env var ANONIMIZACION_DB_URL leída por
# migrations/env.py, o Config.set_main_option en tests) -- nunca un servidor
# Postgres hardcodeado acá. Placeholder deliberadamente inválido para que
# un `alembic upgrade` corrido sin configurar la URL falle explícito en vez
# de escribir donde no corresponde.
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
