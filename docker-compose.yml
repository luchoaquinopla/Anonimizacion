services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anonimizacion
      POSTGRES_PASSWORD: anonimizacion_dev
      POSTGRES_DB: anonimizacion
    ports:
      # 5433 en el host: el 5432 nativo de Windows ya está ocupado por otro
      # Postgres instalado como servicio (ver postgres.exe corriendo aparte).
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anonimizacion -d anonimizacion"]
      interval: 2s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: anonimizacion_dev
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
