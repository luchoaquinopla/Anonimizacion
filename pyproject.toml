[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anonimizacion"
version = "0.1.0"
description = "PDF clinical document extraction and PII anonymization pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pymupdf>=1.24",
    "presidio-analyzer>=2.2",
    "spacy>=3.8",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "celery>=5.3",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
anonimizacion = "anonimizacion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anonimizacion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "postgres: requiere Postgres real (docker-compose.yml, puerto 5433); se salta solo si no puede conectar",
]

[tool.coverage.run]
source = ["src/anonimizacion"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

# Deuda de complejidad conocida (C901): seis funciones puntuales en
# reconciliacion/ecg_mortara.py, reconciliacion/eco_doppler.py,
# parseo/eco_doppler.py y parseo/laboratorio_general.py superan el límite.
# Son parsers y reconciliadores calibrados contra muestras reales de PDFs
# clínicos; no se refactorizan en esta limpieza porque tocar su lógica sin
# un corpus de muestras nuevas para validar contra ellas es riesgo puro de
# romper una calibración fina y silenciosa. Para bajarles la complejidad
# con seguridad hace falta: (a) un corpus de PDFs reales representativo
# para regression-test antes/después del refactor, y (b) descomponer cada
# función en sub-pasos con nombre propio validados contra ese corpus, no
# solo contra los fixtures sintéticos actuales.
#
# La exención vive función por función, vía `# noqa: C901` en la línea de
# cada `def` -- no por archivo -- para que cualquier función NUEVA que
# aterrice en esos mismos archivos (p. ej. cinecoronariografía) siga
# chocando contra el límite. Ver cada `noqa` en el código para la lista
# completa.

[tool.ruff.lint.per-file-ignores]
# Import sin uso preexistente, fuera de alcance de esta limpieza: el
# archivo es un test del panel (scripts/servir_panel.py), explícitamente
# excluido de esta rama.
"tests/scripts/test_servir_panel.py" = ["F401"]
