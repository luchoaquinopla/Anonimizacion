[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anonimizacion"
version = "0.1.0"
description = "PDF clinical document extraction and PII anonymization pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anonimizacion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/anonimizacion"]
