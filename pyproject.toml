[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anonimizacion"
version = "0.1.0"
description = "PDF clinical document extraction and PII anonymization pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pymupdf>=1.24",
    "presidio-analyzer>=2.2",
    "spacy>=3.8",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyarrow>=16",
    "psycopg[binary]>=3.1",
    "celery>=5.3",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anonimizacion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/anonimizacion"]
