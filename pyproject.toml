[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anonimizacion"
version = "0.1.0"
description = "PDF clinical document extraction and PII anonymization pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pymupdf>=1.24",
    "presidio-analyzer>=2.2",
    "spacy>=3.8",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "numpy>=1.26",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16",
]

[project.scripts]
anonimizacion = "anonimizacion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anonimizacion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "postgres: requiere Postgres real (docker-compose.yml, puerto 5433); se salta solo si no puede conectar",
    "caracterizacion: fija el comportamiento actual del sistema (Entrega 0, auditoria-y-poda) -- ver openspec/changes/auditoria-y-poda",
    "empaquetado: construye e instala el wheel real en un venv efimero (Entrega 4, auditoria-y-poda) -- corre por defecto, sin red ni dependencias nuevas",
]

[tool.coverage.run]
source = ["src/anonimizacion"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

# Seis funciones exentas de C901 (una por línea de `def`, no por archivo), parsers y
# reconciliadores calibrados contra muestras reales de PDFs clínicos.
# Invariante: «Funciones exentas de complejidad» (Obsidian, Invariantes medidos).

